<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crawler for free!</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            color: #333;
        }
        label {
            margin-right: 10px;
        }
        input[type="text"] {
            padding: 8px;
            width: 50%;
            margin-bottom: 20px;
        }
        button {
            padding: 10px 20px;
            background-color: #4CAF50;
            color: white;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #45a049;
        }
        #status {
            margin-top: 20px;
            font-weight: bold;
        }
        #content {
            white-space: pre-wrap;
            margin-top: 20px;
            font-family: monospace;
            background-color: #f4f4f4;
            padding: 10px;
            border-radius: 5px;
            word-wrap: break-word;
        }
    </style>
</head>
<body>
    <h1>Craw for Free</h1>
    <label for="url">Link:</label>
    <input type="text" id="url" name="url" placeholder="Link you want to craw">
    <button onclick="fetchData()">Craw</button>

    <p id="status"></p>
    <pre id="content"></pre>

    <script>
        function fetchData() {
            const url = document.getElementById('url').value;
            if (!url) {
                alert('Please enter a link!');
                return;
            }

            // 使用CORS代理绕过同源策略
            const proxyUrl = 'https://api.allorigins.win/get?url=';
            const fullUrl = proxyUrl + encodeURIComponent(url);

            // 发起请求
            fetch(fullUrl)
                .then(response => response.json())
                .then(data => {
                    // 显示爬取的内容
                    document.getElementById('status').textContent = '状态：成功';
                    document.getElementById('content').textContent = data.contents.substring(0, 5000);  // 显示前5000个字符
                })
                .catch(error => {
                    document.getElementById('status').textContent = '状态：失败';
                    document.getElementById('content').textContent = '发生错误：' + error;
                });
        }
    </script>
</body>
</html>
